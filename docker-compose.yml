services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    ports:
      - 4321
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-servicio_americano}:${POSTGRES_PASSWORD:-servicio_americano}@db-spa:5432/${POSTGRES_DB:-servicio_americano}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CLIENT_EMAIL: ${GOOGLE_CLIENT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      db-spa:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

  db-spa:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servicio_americano}
      POSTGRES_USER: ${POSTGRES_USER:-servicio_americano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicio_americano}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      # default: para que `app` pueda resolver el host "db-spa"
      - default
      # n8n_network: acceso desde las automatizaciones de n8n
      - n8n_network
volumes:
  postgres_data:

networks:
  n8n_network:
    external: true